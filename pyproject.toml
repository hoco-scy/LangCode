[project]
name = "langcode"
version = "0.1.0"
description = "Production-grade AI Code Agent on LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grandalf>=0.8",
    "httpx>=0.27.0",
    "langchain>=1.3.4",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "psutil>=5.9.0",
    "pydantic>=2.13.4",
    "textual>=0.50.0",
    "tree-sitter>=0.22",
    "tree-sitter-python>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/LangCode"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]